# Dependabot keeps the SHA-pinned actions in .github/workflows and the npm dependencies
# current. Pull requests target dev, the integration branch, and run CI like any other.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    # Wait a week after a release before proposing it, so a compromised release has time
    # to be noticed and pulled.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: deps

  # The pinned packaging tools of the release workflow (@vscode/vsce, ovsx). Not a
  # workspace: the folder has its own package-lock.json, which the root entry does not see.
  - package-ecosystem: npm
    directory: /scripts/release/tools
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      release-tools-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: deps
